<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>vimtoLLM - all space inside! (10 on minus 84)</title>
  <meta name="theme-color" content="#ff0033">
  <link rel="manifest" href="manifest.json">

  <link id="favicon" rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%2322d3ee'/></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=block">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" />
  
  <link rel="stylesheet" href="assets/css/root.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/ui.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script type="importmap"> { "imports": { "@huggingface/transformers": "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0" } } </script>
</head>

<body>
  <div id="app" v-cloak :class="{ 'compact-mode': settingsToggles.isCompactMode }" :data-active-model="activeModel.id">
    <!-- Global Loading Indicator -->
    <div v-if="isLoading || modalIsLoading" class="global-loader" :class="{ 'is-streaming': isTyping }" aria-hidden="true">
      <div class="loader-bar" :style="{ width: (loadProgress || 0) + '%' }"></div>
      <div v-if="loadStatus && !isTyping" class="loader-status">{{ loadStatus }}</div>
    </div>

    <div class="toast-container" aria-live="polite" aria-atomic="true">
      <transition-group name="toast">
        <div v-for="t in toasts" :key="t.id" :class="['toast', t.type]" @click="removeToast(t.id)" title="Zavřít">
          {{ t.message }}
        </div>
      </transition-group>
    </div>

    <header class="app-header" v-if="activeView !== 'landing'">
      <div class="logo-group">
        <h1>NEVIMTO</h1>
        <div class="header-status-badges" v-if="activeProfileId">
          <div class="header-badge profile" title="Aktivní profil">
            <span class="material-symbols-outlined">person</span>
            <span>{{ activeProfile.name }}</span>
          </div>
          <div class="header-badge model" title="Vybraný model">
            <span class="material-symbols-outlined">psychology</span>
            <span>{{ activeModel.name }}</span>
          </div>
          <div v-if="isGuestMode" class="header-badge guest" title="Režim hosta: Data se neukládají">
            <span class="material-symbols-outlined">visibility_off</span>
            <span>HOST</span>
          </div>
        </div>
      </div>
    </header>

    <landing-view v-if="activeView === 'landing'" 
      :deferred-prompt="deferredPrompt"
      :context-profiles="contextProfiles"
      :highlight-text="highlightText"
      :global-search="globalSearch"
      :is-guest-mode="isGuestMode"
      @update:is-guest-mode="isGuestMode = $event"
      @update:global-search="globalSearch = $event"
      @install="installPwa"
      @update:active-profile-id="activeProfileId = $event"
      @continue="activeView = 'chat'"></landing-view>
    
    <chat-view v-else-if="activeView === 'chat'" 
      :chat-history="chatHistory" 
      :is-loading="isLoading" 
      :is-typing="isTyping" 
      :pending-attachments="pendingAttachments" 
      :context-profiles="contextProfiles"
      :selected-model="activeModel"
      :editing-index="editingIndex"
      :edit-buffer="editBuffer"
      :load-progress="loadProgress"
      :max-chars="maxChars"
      :chat-input="chatInput"
      :message-queue="messageQueue"
      :char-count-class="charCountClass"
      :render-markdown="renderMarkdown"
      @remove-queued="removeQueuedMessage"
      @edit-queued="editQueuedMessage"
      @send-message="sendMessage"
      @stop-inference="stopInference"
      @trigger-attachment="triggerAttachment"
      @remove-attachment="removePendingAttachment"
      @regenerate="regenerateResponse"
      @save-kb="addKnowledge"
      @copy="copyToClipboard"
      @download="downloadMessage"
      @start-edit="startEdit"
      @delete-msg="deleteMessage"
      @cancel-edit="cancelEdit"
      @submit-edit="submitEdit"
      @update:editBuffer="editBuffer = $event"
      @update:chat-input="chatInput = $event"
      @open-settings="switchView('settings')"
      @auto-resize="autoResize"></chat-view>

    <settings-view v-else-if="activeView === 'settings'"
      :settings-toggles="settingsToggles"
      :system-health-class="systemHealthClass"
      :storage-usage="storageUsage"
      :system-logs="systemLogs"
      :deferred-prompt="deferredPrompt"
      :log-filter="logFilter"
      :log-search-query="globalSearch"
      :active-downloads="activeDownloads"
      @update:log-search-query="globalSearch = $event"
      @update-theme="setTheme"
      @set-log-filter="setLogFilter"
      @toggle-compact="toggleCompactMode"
      @open-kb="switchView('kb')"
      @open-history="switchView('history')"
      @open-recovery="openRecoveryManager"
      @vacuum="vacuumDatabase"
      @diagnostics="runDiagnostics"
      @install-pwa="installPwa"
      @download-all-missing="downloadAllMissingModels"
      @clear-history="clearHistory"
      @purge-history="purgeOldHistory"
      @undo="undoLastAction"
      @export-json="exportFullStateJSON"
      @export-zip="exportFullBackupZip"
      @trigger-restore="triggerRestoreBackup"
      @abort-model-download="abortModelDownload"
      @clear-cache-update="clearCacheAndUpdate"
      @nuclear-reset="nuclearReset"
      @close="switchView('chat')"></settings-view>

    <history-view v-else-if="activeView === 'history'"
      :filtered-history="filteredHistory"
      :history-search-query="globalSearch"
      :highlight-text="highlightText"
      @update:history-search-query="globalSearch = $event"
      @rollback="rollbackTo"
      @close="activeView = 'chat'"></history-view>

    <kb-view v-else-if="activeView === 'kb'"
      :active-profile="activeProfile"
      :filtered-profiles="filteredProfiles"
      :all-available-tags="allAvailableTags"
      :models="models"
      :selected-model-id="activeProfile.selectedModelId"
      :profile-search-query="globalSearch"
      :selected-tags="selectedTags"
      :is-tag-dropdown-open="isTagDropdownOpen"
      :active-profile-id="activeProfileId"
      :context-profiles="contextProfiles"
      :kb-input="kbInput"
      :kb-importance="kbImportance"
      :kb-locked="kbLocked"
      :storage-usage="storageUsage"
      :max-system-prompt-chars="maxSystemPromptChars"
      :system-prompt-char-class="systemPromptCharClass"
      @update:profile-search-query="globalSearch = $event"
      @update-profile-model="updateProfileModel($event.profileId, $event.modelId)"
      @update:active-profile-id="activeProfileId = $event"
      @update:kb-input="kbInput = $event"
      @update:kb-importance="kbImportance = $event"
      @update:kb-locked="kbLocked = $event"
      @create-profile="createProfile"
      @rename-profile="renameProfile"
      @delete-profile="deleteProfile"
      @open-merge="openModal('merge')"
      @export-profile="exportProfileJSON"
      @trigger-import="triggerProfileImport"
      @remove-tag="removeTagFromProfile($event.profile, $event.tag)"
      @add-tag="addTagToProfile"
      @add-knowledge="addKnowledge"
      @toggle-kb-lock="toggleKBLock"
      @remove-knowledge="removeKnowledge"
      @close="activeView = 'chat'"></kb-view>

    <system-modals
      :active-modal="activeModal"
      :modal-data="modalData"
      :context-profiles="contextProfiles"
      :active-profile="activeProfile"
      :active-profile-id="activeProfileId"
      :merge-source-id="mergeSourceId"
      :context-usage="contextUsage"
      :max-context-chars="maxContextChars"
      :modal-is-loading="modalIsLoading"
      :filtered-compare-data="filteredCompareData"
      @close="closeModal"
      @confirm="modalData.confirm?.onConfirm(); closeModal()"
      @secondary="modalData.confirm?.secondaryAction(); closeModal()"
      @merge="performMerge"
      @update:merge-source-id="mergeSourceId = $event"
      @open-compare="openCompare"
      @run-backup="runAutoBackup"
      @restore-snapshot="confirmRestoreSnapshot"
      @nuclear-reset="nuclearReset"></system-modals>

    <input type="file" ref="restoreBackupInput" @change="handleRestoreBackup" accept=".json" style="display: none;">
    <input type="file" ref="profileImportInput" @change="handleProfileImport" accept=".json" style="display: none;">
    <input type="file" ref="attachmentInput" @change="handleAttachment" accept="image/*" multiple style="display: none;">
  </div>

  <script type="module" src="src/app.js"></script>
</body>

</html>
